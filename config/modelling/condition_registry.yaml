primary_controlled_comparison:
  left_manifest_label: B1_generic_released_rnagenesis
  right_manifest_label: D1_mres_curated_aptamer_diffusion_adapted
  statement: >
    B1 versus D1 is the primary controlled comparison. Both use the released
    frozen EncDec and the generic diffusion family. D1 differs by unconditional
    aptamer-domain adaptation on the frozen TRAIN cores.

shared_claim_limitations:
  - The generator-level claim, if later supported, is only that diffusion adaptation changed generated-sequence characteristics toward held-out aptamer distributions while retaining specified validity, novelty, and diversity.
  - No condition demonstrates binding to KPC-2, NDM-1, OXA-48, or any other protein.
  - No condition demonstrates affinity, biological activity, target selectivity, or a binding mechanism.
  - No condition is target-conditioned. Target prioritisation, if done later, is downstream AptaRank ranking and is not evidence that the generator learned target binding.
  - RNAGenesis receives canonical nucleotide identity only. Modified chemistry recorded in metadata is not a model input and is not learned.
  - aptamer-like means measured similarity to curated aptamer sequence or structure distributions. It does not mean proven binding, function, specificity, or experimental validation.
  - REF and EVAL are prohibited during development. EVAL remains locked until an M9C unlock record.

