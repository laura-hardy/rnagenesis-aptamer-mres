# M7_IMPLEMENTATION_READY_FOR_REVIEW_NOT_AUTHORISED
# Authoritative inactive M7 candidate-guardrail configuration.
# This file must not be consumed by an executable workflow. It binds no GPU, no
# output directory, no checkpoint path, no biological path and no authorisation.
# Its entry point accepts --help, --schema and --authorisation-id <id> (refused while
# this file is inactive). A later authorisation-only
# commit may change only this file, adding one entry per candidate evaluated, in
# the order of the sealed validation ranking. The production generation
# callable is implemented; this inactive file binds no value for it to use,
# including no LD_LIBRARY_PATH value.

