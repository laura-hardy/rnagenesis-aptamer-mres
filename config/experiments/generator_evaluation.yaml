    - materialised_and_verified_1000_attempt_schedule
    - fixed_validation_artifacts
    - completed_and_accepted_b1_diagnostic_evidence
    - frozen_code_and_configuration_hashes
    - final_human_closure_decision
  formally_deferred_beyond_m4:
    - clustering_dependent_claims
    - clustering_identity_threshold
    - frozen_representation_or_embedding_metrics
    - representation_aggregation_rules
  explicitly_deferred_to_m5:
