layers:
  hard_guardrails:
    role: eligibility
    config: config/modelling/validation_metrics_v1.yaml
    selects_among_eligible_checkpoints: false
    failure_makes_a_checkpoint_ineligible: true
  primary_validation_loss_selection:
    role: choose_the_eligible_checkpoint
    metric: lowest_fixed_draw_VALIDATION_denoising_mse
    weighted_composite: false
    rule: >
      Select the checkpoint with the lowest fixed-draw VALIDATION denoising
      MSE, provided it passes every approved hard generated-sample guardrail.
  secondary_distribution_diagnostics:
    role: interpretation_only
    may_replace_the_primary_rule: false
    may_be_threshold_optimized: false
    items:
      - nearest_TRAIN_normalized_edit_distance
      - maximum_identity_to_TRAIN
      - nucleotide_and_dinucleotide_distributions
      - mfe_and_mfe_per_nucleotide
      - paired_fraction
      - full_length_stratified_results
    deferred_beyond_m4:
      - generated_cluster_concentration
      - clustering_identity_threshold
      - frozen_representation_or_embedding_metrics
      - representation_aggregation_rules
  final_held_out_evaluation:
    role: EVAL_only_after_M9C_unlock
    may_influence_development_decisions: false
    after_seeing_eval_prohibited:
      - retrain_rnagenesis
      - recalibrate_aptarank
      - change_thresholds_to_improve_eval
      - return_to_validation_and_reopen_eval

data_roles:
  TRAIN:
    permitted: [fitting, copying_and_novelty_reference]
    prohibited: [checkpoint_selection, aptarank_calibration]
  VALIDATION:
    permitted: [development_decisions, fixed_draw_checkpoint_selection, development_generator_comparison]
    prohibited: [fitting, final_held_out_claim]
  REF:
    permitted: [later_aptarank_calibration_after_generator_freeze]
    prohibited_until_m9b: true
    prohibited_for:
      - rnagenesis_fitting
      - checkpoint_selection
      - hyperparameter_choice
      - development_generator_comparison
  EVAL:
    permitted: [final_assessment_after_m9c_unlock]
    locked_until: explicit_M9C_unlock_record
    physical_absence_preferred_until_m10: true

conditions:
  primary_controlled_comparison: [B1_generic_released_rnagenesis, D1_mres_curated_aptamer_diffusion_adapted]
  empirical_null: B2_train_matched_empirical_null
  external_comparator: B0_released_aptamer_rnagenesis
  b0_is_not_the_primary_causal_baseline: true
  b0_length_sensitive_comparisons_require_one_of:
    - normalization
    - stratification
    - preregistered_comparable_length_subset
  b0_existing_pool_raw_attempts: 30080
  new_condition_primary_generation_target_raw_attempts: 30000
  development_diagnostic_sample_raw_attempts: 1000

accounting:
  report_separately:
    - raw_attempted_sequences
    - successfully_parsed_outputs
    - valid_acgu_outputs
    - unique_valid_outputs
    - duplicate_outputs
    - invalid_outputs
    - metric_specific_denominator
  silent_removal_of_invalid_or_duplicate_attempts: prohibited
  requested_length_exact_hit:
    label: DIAGNOSTIC_REPORT_NOT_AN_EXECUTION_SUCCESS_REQUIREMENT
    execution_success_requirement: false
    low_exact_hit_rate_invalidates_or_reruns_the_b1_diagnostic_pool: false
    numerator: valid_outputs_whose_cleaned_length_equals_the_requested_biological_length
    denominator: raw_attempts
    measured_before_filtering: true
    invalid_or_unparseable_accounted_attempts_are_non_hits: true
    valid_only_diagnostic_does_not_replace_the_raw_attempt_metric: true
    zero_raw_attempts_exact_hit_rate: 0.0
    zero_raw_attempts_fails_the_diagnostic_run: false
    always_report_together:
      - raw_attempts
      - valid_outputs
      - exact_hits

sequence_clustering_identity_threshold:
  status: DEFERRED_BEYOND_M4
  m4_closure_blocker: false
  value: null
  invented_in_this_draft: false
  clustering_dependent_claims_permitted: false
  deferred_quantities:
    - generated_cluster_concentration
    - cluster_count
    - singleton_fraction
    - largest_cluster_share
    - shannon_diversity
    - effective_cluster_count

structure_metrics:
  software: ViennaRNA
  recorded_h200_version_not_a_new_pin: 2.7.0
  more_negative_mfe_is_not_inherently_better: true
  interpretation: distributional_plausibility_not_protein_binding

representation_metrics:
  model_status: DEFERRED_BEYOND_M4
  embedding_aggregation: DEFERRED_BEYOND_M4
  m4_closure_blocker: false
  implemented_in_m4: false

statistical_reporting:
  prefer:
    - full_distributions
    - effect_sizes
    - seed_level_summaries
    - confidence_intervals_that_respect_seed_structure
    - length_stratification
  avoid: tiny_p_values_produced_only_by_tens_of_thousands_of_generated_sequences

final_m4_closure_blockers:
  status: OPEN_AFTER_STAGE_1_IMPLEMENTATION_APPROVAL_UNTIL_FINAL_M4_COMPLETE
  may_remain_open_after_approval_of_this_stage_1_package: true
  may_remain_open_after_approval_of_this_draft: true
  m4_complete: false
  must_be_resolved_before: final_M4_COMPLETE_GO
  items:
