future_implementation_must_reject:
  status: APPROVED_STAGE_1_DESIGN
  nucleotide_probabilities_computed_in_this_stage: false
  probability_sum_tolerance:
    value: 1.0e-12
    absolute_tolerance: 1.0e-12
    relative_tolerance: 0
    dtype: float64
    status: APPROVED_STAGE_1_DESIGN
    ordered_values: [A, C, U, G]
    finite_and_nonnegative_required: true
    rule: >
      Compute probabilities in float64. Reject non-finite or negative
      values. Reject any ordered A/C/U/G vector unless
      abs(sum(probabilities) - 1.0) <= 1e-12. Relative tolerance is zero.
      This stage does not compute nucleotide probabilities.
  reject:
    - an_empty_TRAIN_stream
    - a_non_ACGU_character
    - a_count_other_than_669
    - a_duplicate_input_sequence
    - non_finite_or_negative_probabilities
    - any_probability_vector_whose_ordered_A_C_U_G_values_do_not_sum_to_1_within_a_documented_numerical_tolerance

existing_script_gap:
