raw_record_fields:
  status: APPROVED_STAGE_1_DESIGN
  serialization: utf8_json_lines
  one_object_per_attempt: true
  canonical_bytes:
    status: APPROVED_STAGE_1_DESIGN
    encoding: utf-8
    one_json_object_per_attempt: true
    key_order: exact_declared_field_order
    separators:
      item: ","
      key_value: ":"
    ensure_ascii: false
    spaces_outside_string_values: false
    line_ending: LF
    lf_after_every_record_including_the_final_record: true
    bom: false
    carriage_returns: false
    raw_output_sha256: sha256_of_those_exact_file_bytes
  fields:
    - name: attempt_index
      type: integer
      indexing: zero_based
    - name: seed
      type: integer
    - name: sampled_length
      type: integer
    - name: sequence
      type: string
    - name: valid_acgu
      type: boolean
    - name: sequence_sha256
      type: string
      definition: sha256_of_utf8_sequence_bytes_without_a_trailing_newline

