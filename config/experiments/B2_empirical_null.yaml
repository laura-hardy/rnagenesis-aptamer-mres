stage_2a_correction:
  status: UNDER_REVIEW
  execution_authorised: false
  success_claimed: false
  m4_complete: false
  first_implementation: failed_review
  first_implementation_failure: >
    The first Stage 2A implementation failed review because production
    accepted caller-controlled --repo-root and --config arguments. Those
    arguments could replace the repository configuration authority.
  corrected_implementation: under_review
  note: >
    A corrected implementation is under review. This record is not a
    success claim and does not authorise a biological run.

execution:
  authorised: false
  evidence_directory_created_by_this_stage: false
  overwrite_existing_output: refuse
  overwrite_or_append_existing_evidence_directory: refuse
  runner_gate: >
    scripts/null_model.py must refuse execution while
    consumable_by_executable_workflow is false. It must also refuse while
    document_status is APPROVED_FOR_M4_IMPLEMENTATION_NOT_EXECUTION.
    A future scientific run requires consumable_by_executable_workflow true
    and document_status APPROVED_FOR_SCIENTIFIC_EXECUTION. Stage 2A sets
    neither of those execution signals.
  manifest_serialization: >
    Deterministic UTF-8 JSON. Declared key order. Compact separators comma
    and colon. ensure_ascii false. No spaces outside strings. No BOM. No
    carriage returns. One trailing LF. Float64 quantities are decimal
    strings produced with format .17g. Unknown run results are explicit
    nulls with status UNKNOWN_UNTIL_RUN only when a field is genuinely
    unavailable. A completed run must record observed values for fields it
    can observe. The corrected implementation writes a manifest only after
    the execution gate passes. This configuration does not pass that gate,
    this review does not write a manifest, and this review does not
    authorise a run.

input:
  authoritative_role: TRAIN_TEXT
  expected_repository_relative_name: data/processed/corpus_final.txt
  expected_development_path: /home/laura/rnagenesis-mres-data/development/corpus_final.txt
  expected_sha256: d6cbc41a36b4a83e393e5593598a2bda246bc6e9df151d236381885734e05c9d
  expected_sequence_count: 669
  expected_unique_count: 669
  alphabet: "^[ACGU]+$"
  order: first_occurrence_in_frozen_ft_train_csv
  prohibited_inputs:
    - ft_train.csv
    - ft_validation.csv
    - ref.csv
    - eval.csv
  note: >
    The 726 TRAIN identity rows are not the sampling multiset. Sampling uses
    the 669-core TRAIN text, one row per unique core.

sampler:
  status: APPROVED_STAGE_1_DESIGN
  raw_sequence_count: 30000
  numpy_generator: numpy.random.default_rng
  seed: 42
  proposed_seed: 42
  length_source: empirical_length_list_of_the_669_cores
  length_sampling: with_replacement
  nucleotide_sampling: independent_draws_from_pooled_TRAIN_nucleotide_frequencies
  proposed_probability_order: [A, C, U, G]
  probability_order: [A, C, U, G]
  probability_order_status: APPROVED_STAGE_1_DESIGN
  probability_dtype: float64
  probability_sum_rule: "abs(sum(probabilities) - 1.0) <= 1e-12"
  absolute_tolerance: 1.0e-12
  relative_tolerance: 0
  probability_order_reason: >
    scripts/null_model.py builds frequencies with insertion order A, C, U, G.
    That order is the approved Stage 1 design. Numeric probabilities are
    computed in float64 only when an authorised run reads TRAIN text.
    This stage does not compute them and does not invent them.
  rng_consumption_order:
    - one_draw_of_30000_lengths_with_replacement_from_the_669_length_list
    - then_for_each_sampled_length_in_that_order_independent_nucleotide_draws
  deduplication: false
  filtering: false
  truncation: false
  t_to_u_conversion: false
  rewriting: false
  retain_all_attempts: true
  attempt_order_preserved: true
  unique_count_of_the_30000:
    role: reported_diagnostic_only
    not_an_acceptance_threshold: true
    not_a_reason_to_drop_rows: true

