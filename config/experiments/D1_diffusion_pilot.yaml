    absence_does_not_by_itself_block_final_m4_closure: true
    reason: >
      The implementation plan assigns microbatch, accumulation, mixed
      precision, and EMA to M5. Final M4 closure is not blocked merely
      because those M5-dependent hardware results do not yet exist.
      Comparisons still must not mix raw and EMA weight variants, and the
      evaluated weight variant must be recorded.
  mixed_precision_note: >
    Do not select FP16 because it is available. The plan prefers a
    conservative smoke mode first and BF16 for a later full run only if
    M5 evidence supports it. This pilot draft leaves precision unresolved.
