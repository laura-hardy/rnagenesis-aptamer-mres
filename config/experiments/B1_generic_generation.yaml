  blocked_until: "The single development-pool run is consumed_complete and is not re-executable. The authorization parent remains 4de4246aa4a97eadaf30caf449e3046378832366. Phase A, Phase B, M5 execution, and D1 training stay closed. M4 COMPLETE / GO authorises M5 planning only. Checkpoint eligibility remains unclaimed. REF and EVAL stay closed."
  identification: >
    This 1000-attempt pool is the accepted diagnostic generation sample for
    B1 and, with the same target-length list and paired generation-seed
    schedule, is reusable for the later paired D1 workflow where technically
    applicable. It is not an independent-biological-replicate set or an
    exact-length accepted production pool.
  raw_target_lengths: 1000
  sampling: with_replacement_from_the_669_core_TRAIN_empirical_length_list
  target_length_sampling_seed: 43000
  proposed_length_sampler: numpy.random.default_rng
  length_sampler_status: RESTORED_STAGE_1_DIAGNOSTIC_CONTRACT_APPROVED_FOR_IMPLEMENTATION_NOT_EXECUTION
  source_ordered_length_vector_count: 669
  source_order_rule: preserve_supplied_first_occurrence_order_do_not_reorder_before_sampling
  generation_seed_base: 44000
  generation_seed_schedule:
    status: RESTORED_STAGE_1_DIAGNOSTIC_CONTRACT_APPROVED_FOR_IMPLEMENTATION_NOT_EXECUTION
    separate_from_target_length_sampling_seed: true
    execution_plan:
      - sample_exactly_1000_target_lengths_in_attempt_index_order_from_the_669_core_empirical_length_list
      - retain_those_original_attempt_indexes
      - group_attempts_by_target_length_in_ascending_target_length_order
      - within_each_target_length_retain_original_attempt_index_order
      - divide_each_group_into_consecutive_chunks_of_at_most_16
      - invoke_generation_once_per_chunk_using_its_actual_chunk_size_with_batch_num_1
      - assign_invocation_seeds_as_44000_plus_zero_based_invocation_index
      - never_pad_duplicate_replace_reject_resample_or_drop_an_attempt
      - map_every_generated_record_back_to_its_original_target_length_attempt_index
      - reuse_the_identical_target_list_grouping_rule_chunk_membership_and_invocation_seeds_for_paired_b1_d1_comparisons_where_technically_applicable
    manifest_contains_the_complete_invocation_table_before_generation_begins: true
    invocation_table_columns:
      - zero_based_invocation_index
      - invocation_seed
      - target_length
      - actual_chunk_size
      - batch_num
      - original_attempt_indexes_in_order
    batch_num: 1
  execution_blocked_until_length_mapping_or_rejection_resampling_algorithm_approved: false
  length_mismatch_and_early_eos_are_diagnostic_outcomes: true
  length_mismatch_or_early_eos_fails_the_diagnostic_run: false
  do_not_change_1000_to_fit_batch_16: true
  note: >
    1000 is not divisible by 16. Chunks use their actual size, at most 16.
    The schedule never pads, duplicates, replaces, rejects, resamples, or
    drops an attempt. Early EOS and length mismatch are diagnostic outcomes.
    They do not fail the diagnostic run. The authorisation below records the
    consumed physical GPU 1 scope. It does not authorise another run and
    does not resample the accepted schedule.
